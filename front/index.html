<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de usuarios</title>
    <link rel="stylesheet" href="styles/estilo.css">
</head>
<body>
    <main>
        <header>
            <h1>Gestão de usuarios</h1>
            <p>Cadastre, consulte, atualize e remova usuários em um só lugar</p>
        </header>

        <section>
            <div>
                <span>Dados do usuário</span>
                <h2>Gerenciar cadastros</h2>
            </div>

            <div class="fields">
                <label class="field">
                    <span>ID:</span>
                    <input type="text" id="id" placeholder="Ex: 007" autocomplete="off">
                </label>
                <label class="field">
                    <span>NOME</span>
                    <input type="text" id="name" placeholder="Nome do usuário" autocomplete="off">
                </label>
            </div>

            <div class="action">
                <button class="primary" type="button" onclick="criar()">Criar usuarios</button>
                <button class="secondary" type="button" onclick="buscarTodos()">Buscar Todos</button>
                <button class="secondary" type="button" onclick="Alterar()">Alterar</button>
                <button class="danger" type="button" onclick="deletar()">Deletar</button>
            </div>

            <p class="feedback" id="resultado"></p>
        </section>

        <section>
            <div>
                <span>CADASTROS</span>
                <h2>Lista de usuários</h2>
            </div>
            <ul id="listaUsuarios"></ul>
        </section>
    </main>

    <script src="./scripts/index.js"></script>
</body>
</html>
